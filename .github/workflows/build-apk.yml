name: Build GlyphDistanceToy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o GlyphDistanceToy-v0.4-source.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Download Nothing Glyph Matrix SDK
        run: |
          mkdir -p app/libs
          curl -L --fail \
            "https://github.com/Nothing-Developer-Programme/GlyphMatrix-Developer-Kit/raw/refs/heads/main/glyph-matrix-sdk-2.0.aar" \
            -o app/libs/glyph-matrix-sdk-2.0.aar

      - name: Build APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GlyphDistanceToy-v0.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlyphDistanceToy-APK
          path: GlyphDistanceToy-v0.4.apk
          if-no-files-found: error
