name: Build installable APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o GlyphDistanceToy-GoogleFit-v0.2.zip
          cp -r GlyphDistanceToy/app .
          cp GlyphDistanceToy/settings.gradle.kts .
          cp GlyphDistanceToy/build.gradle.kts .
          cp GlyphDistanceToy/gradle.properties .

          sed -i 's/compileSdk = 35/compileSdk = 36/' app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Download Nothing Glyph Matrix SDK
        run: |
          mkdir -p app/libs
          curl --fail --location \
            https://github.com/Nothing-Developer-Programme/GlyphMatrix-Developer-Kit/raw/refs/heads/main/glyph-matrix-sdk-2.0.aar \
            --output app/libs/glyph-matrix-sdk-2.0.aar

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GlyphDistanceToy.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlyphDistanceToy-APK
          path: GlyphDistanceToy.apk
